<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今天吃什么</title>
<meta name="theme-color" content="#FBFAF5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<div class="wrap">
  <header>
    <h1>今天吃什么</h1>
    <div class="date" id="today"></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="lib">菜单</button>
    <button class="tab" role="tab" aria-selected="false" data-view="draw">抽菜</button>
  </div>

  <!-- ===== 菜单 ===== -->
  <section class="view on" id="v-lib">
    <div class="account" id="account"></div>

    <div class="libhead">
      <input class="field" id="q" placeholder="搜菜名" autocomplete="off">
      <button class="btn sm" id="btnAddToggle">加菜</button>
    </div>
    <div class="catnav" id="catnav"></div>
    <div id="libList"></div>

    <div class="backup">
      <p class="hint" id="cloudNote"></p>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn sm" id="btnExport">导出备份</button>
        <button class="btn sm" id="btnSeed" hidden>导入初始 97 道菜</button>
      </div>
    </div>
  </section>

  <!-- ===== 抽菜 ===== -->
  <section class="view" id="v-draw">
    <div class="filterbar">
      <div class="filtersum" id="fsum"></div>
      <button class="btn sm" id="ftoggle">筛选<span class="badge" id="fcount" hidden></span></button>
    </div>
    <div class="panel" id="fpanel" hidden></div>

    <div class="board blank" id="board">
      <p class="dish placeholder">正在读菜单…</p>
    </div>

    <div class="row">
      <button class="btn" id="btnDraw">抽一道</button>
      <button class="btn primary" id="btnEat" disabled>就吃它</button>
    </div>

    <div class="recent">
      <p class="secthead">最近吃过</p>
      <div id="logList"></div>
    </div>
  </section>

</div>

<div id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=12"></script>
<script type="module" src="app.js?v=12"></script>
</body>
</html>
